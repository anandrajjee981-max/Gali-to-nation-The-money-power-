<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gali to Nation | The Money Journey</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>

    <div class="glass-card" id="game-container">
        <div id="start-screen" class="screen active">
            <h1>💰 Gali to Nation</h1>
            <h3>The Money Journey: Level 1</h3>
            <p>I am your journey mentor <strong>Ar</strong>. Let's start!</p>
            <input type="text" id="player-name" placeholder="What is your name?">
            <button onclick="startGame()">Start Day 0</button>
        </div>

        <div id="game-screen" class="screen">
            <div class="header-stats">
                <div class="stat-box">📅 Day <span id="day-val">1</span>/7</div>
                <div id="money-display" class="stat-box money">₹<span id="money-val">150</span></div>
            </div>

            <div id="narration" class="narration-text">
                It is your day 0 and today your mummy give you 150 rupee as a pocket money.
            </div>

            <div id="options-container" class="options-grid">
                </div>

            <div class="dashboard">
                <div class="resume">
                    <h4>📜 Resume Skills</h4>
                    <ul id="skills-list"><li>None</li></ul>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
